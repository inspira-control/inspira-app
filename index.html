<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspira | Detalles únicos </title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --lilac: #C3B1E1;
            --lilac-dark: #957DAD;
            --mint: #A8E6CF;
            --mint-dark: #3D84A8; /* Un poco más azulado para contraste */
            --bg: #FDFBF7;
            --text: #4A4A4A;
            --white: #FFFFFF;
            --shadow: 0 10px 25px rgba(149, 125, 173, 0.15);
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #F5F7FA 0%, #E8F5E9 100%);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* HEADER */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo-text {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(90deg, var(--lilac-dark), var(--mint-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }
        .tagline { color: #888; font-size: 0.9rem; }

        /* LOGIN OVERLAY */
        .login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000; flex-direction: column;
        }
        .login-box {
            background: white; padding: 40px; border-radius: 30px;
            box-shadow: var(--shadow); text-align: center; width: 90%; max-width: 350px;
            border: 2px solid var(--lilac);
        }
        .input-cute {
            width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 15px;
            font-family: 'Nunito'; margin: 10px 0; outline: none; transition: 0.3s;
        }
        .input-cute:focus { border-color: var(--lilac); }
        
        .btn {
            padding: 12px 25px; border: none; border-radius: 20px; cursor: pointer;
            font-weight: 700; font-family: 'Nunito'; transition: transform 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .btn:hover { transform: translateY(-2px); }
        .btn-primary { background: var(--lilac); color: white; }
        .btn-success { background: var(--mint); color: var(--text); }
        .btn-whatsapp { background: #25D366; color: white; }

        /* LAYOUT */
        .container { width: 100%; max-width: 1200px; display: none; } /* Oculto hasta login */
        
        .tabs {
            display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; flex-wrap: wrap;
        }
        .tab-btn {
            background: white; padding: 10px 20px; border-radius: 20px; border: 2px solid var(--lilac);
            color: var(--lilac-dark); cursor: pointer; font-weight: 600;
        }
        .tab-btn.active { background: var(--lilac); color: white; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        
        .card {
            background: white; border-radius: 20px; padding: 20px;
            box-shadow: var(--shadow); transition: 0.3s; border: 1px solid rgba(195, 177, 225, 0.2);
        }
        .card:hover { transform: translateY(-5px); }
        .card img { width: 100%; height: 150px; object-fit: cover; border-radius: 15px; margin-bottom: 10px;}
        .price-tag { color: var(--mint-dark); font-weight: 800; font-size: 1.2rem; }

        /* MODAL / FORMS */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 2000;
        }
        .modal-content {
            background: white; padding: 30px; border-radius: 25px; width: 90%; max-width: 500px;
            max-height: 90vh; overflow-y: auto;
        }

        /* CART */
        .cart-float {
            position: fixed; bottom: 20px; right: 20px; background: var(--lilac-dark);
            color: white; padding: 15px 25px; border-radius: 50px; cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2); font-weight: bold; z-index: 100;
        }

        /* TABLES */
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 15px; overflow: hidden; box-shadow: var(--shadow);}
        th { background: var(--mint); color: var(--text); padding: 15px; text-align: left;}
        td { padding: 15px; border-bottom: 1px solid #eee; }
        
        .status-badge { padding: 5px 10px; border-radius: 10px; font-size: 0.8rem; font-weight: bold;}
        .status-pending { background: #FFE5E5; color: #D32F2F; }
        .status-progress { background: #FFF3E0; color: #F57C00; }
        .status-done { background: #E8F5E9; color: #388E3C; }

        /* Loader Cute */
        .loader-container {
            display: flex; justify-content: center; align-items: center;
            height: 200px; width: 100%;
        }
        .loader {
            width: 40px; height: 40px;
            border: 5px solid var(--lilac);
            border-top: 5px solid var(--mint);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Estilos para búsqueda y botones de acción */
        .search-container { margin-bottom: 20px; display: flex; gap: 10px; }
        .search-container input { flex-grow: 1; }

        .btn-action {
            padding: 8px 12px; border: none; border-radius: 10px; cursor: pointer; margin-right: 5px; font-size: 0.9rem;
        }
        .btn-edit { background: var(--lilac); color: white; }
        .btn-delete { background: #FF6B6B; color: white; }
        .btn-action:hover { opacity: 0.8; }

        /* Ocultar input oculto */
        .hidden { display: none; }
      
    </style>
</head>
<body>

    <!-- LOGIN -->
    <div id="loginScreen" class="login-overlay">
        <div class="login-box">
            <h2 class="logo-text">Inspira</h2>
            <p>Acceso Administrativo ✨</p>
            <input type="password" id="passInput" class="input-cute" placeholder="Contraseña">
            <button class="btn btn-primary" onclick="login()">Entrar</button>
            <br><br>
            <button class="btn btn-success" onclick="showPublic()">Ver Catálogo (Público)</button>
        </div>
    </div>

    <!-- APP PRINCIPAL -->
    <div class="container" id="appContainer">
        <div class="header">
            <h1 class="logo-text">Inspira</h1>
            <p class="tagline">Gestión de Pedidos & Clientes 💜</p>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('catalogo')">🛍️ Catálogo</button>
            <button class="tab-btn" onclick="showTab('pedidos')">📦 Pedidos</button>
            <button class="tab-btn" onclick="showTab('clientes')">👥 Clientes</button>
            <button class="tab-btn" onclick="showTab('inventario')">📊 Inventario</button>
        </div>

        <!-- SECCIÓN CATÁLOGO -->
        <div id="tab-catalogo" class="tab-content">
        <div id="loadingSpinner" class="loader-container">
        <div class="loader"></div>
                <p style="margin-left: 15px; color: var(--lilac-dark); font-weight: bold;">Cargando productos mágicos... ✨</p>
        </div>
            <div class="grid" id="productGrid">
                <!-- Productos cargados por JS -->
            </div>
        </div>

        <!-- SECCIÓN PEDIDOS -->
        <div id="tab-pedidos" class="tab-content" style="display:none">
            <h3>Pedidos Recientes</h3>
            <table id="ordersTable">
                <thead>
                    <tr><th>Fecha</th><th>Cliente</th><th>Total</th><th>Pagado</th><th>Status</th><th>Acción</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <!-- SECCIÓN CLIENTES -->
        <div id="tab-clientes" class="tab-content" style="display:none">
            <div class="search-container">
            <button class="btn btn-primary" onclick="openModal('clientModal')">+ Nuevo Cliente</button>
            <input type="text" id="searchClient" class="input-cute" placeholder=" Buscar por nombre o teléfono..." onkeyup="filterClients()">
        </div>
    
        <table id="clientsTable" style="margin-top:20px">
            <thead>
                <tr><th>Nombre</th><th>Teléfono</th><th>Dirección</th><th>Acciones</th></tr>
            </thead>
        <tbody></tbody>
        </table>
        </div>
        
        <!-- SECCIÓN INVENTARIO -->
        <div id="tab-inventario" class="tab-content" style="display:none">
            <h3>Stock Actual</h3>
            <table id="inventoryTable">
                <thead><tr><th>Producto</th><th>Stock</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <!-- CARRITO FLOTANTE -->
    <div id="cartFloat" class="cart-float" style="display:none" onclick="checkout()">
        🛒 Ver Pedido (<span id="cartCount">0</span>)
    </div>

    <!-- MODAL PEDIDO -->
    <div id="orderModal" class="modal">
        <div class="modal-content">
            <h2>Finalizar Pedido 💜</h2>
            <label>Cliente:</label>
            <select id="selectClient" class="input-cute"></select>
            <label>Anticipo:</label>
            <input type="number" id="inputAnticipo" class="input-cute" value="0">
            <div id="orderSummary"></div>
            <button class="btn btn-whatsapp" onclick="sendWhatsApp()"><i class="fab fa-whatsapp"></i> Enviar Pedido</button>
            <button class="btn btn-primary" onclick="saveOrder()">Guardar en Sistema</button>
            <button class="btn" style="background:#eee" onclick="closeModal('orderModal')">Cancelar</button>
        </div>
    </div>

    <!-- MODAL CLIENTE -->
    <div id="clientModal" class="modal">
    <div class="modal-content">
        <h2 id="modalTitle">Nuevo Cliente ✨</h2>
        <input type="hidden" id="cId"> <!-- Campo oculto para el ID -->
        <input type="text" id="cName" class="input-cute" placeholder="Nombre">
        <input type="text" id="cPhone" class="input-cute" placeholder="Teléfono">
        <input type="text" id="cAddr" class="input-cute" placeholder="Dirección">
        <button class="btn btn-primary" onclick="saveClient()">Guardar</button>
        <button class="btn" style="background:#eee" onclick="closeModal('clientModal')">Cerrar</button>
    </div>
</div>

    <script>
        // CONFIGURACIÓN
        const API_URL = "https://script.google.com/macros/s/AKfycbwz8Y582w5SJN6S-3GJY6D963mziMQuEF4zkw11x_6DW6IhtxmDWKdOgSsIqE-XSA/exec"; // PEGA AQUÍ LA URL DEL PASO 2
        const ADMIN_PASS = "inspira1403";
        
        let products = [];
        let clients = [];
        let cart = [];

        // --- LOGIN ---
        function login() {
            const pass = document.getElementById('passInput').value;
            if (pass === ADMIN_PASS) {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('appContainer').style.display = 'block';
                loadData();
            } else {
                alert("Contraseña incorrecta 🥺");
            }
        }

        function showPublic() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('appContainer').style.display = 'block';
            // Ocultar tabs admin solo para vista pública (opcional)
            loadData(); 
        }

        // --- DATA LOADING ---
        async function loadData() {
            // Mostrar el spinner
            document.getElementById('loadingSpinner').style.display = 'flex';
            
            try {
                // Cargar Productos
                const resP = await fetch(`${API_URL}?tipo=Productos`);
                products = await resP.json();
                renderProducts();
                renderInventory();

                // Cargar Clientes
                const resC = await fetch(`${API_URL}?tipo=Clientes`);
                clients = await resC.json();
                renderClients();
                populateClientSelect();
            } catch (e) {
                console.error("Error cargando datos", e);
                alert("Hubo un error al cargar los datos. Revisa tu conexión o la API.");
            } finally {
                // Ocultar el spinner cuando termine (exite o falle)
                document.getElementById('loadingSpinner').style.display = 'none';
            }
        }

        // --- RENDERIZADO ---
        function renderProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = products.map(p => `
                <div class="card">
                    <img src="${p.ImagenURL || 'https://via.placeholder.com/150'}" alt="${p.Nombre}">
                    <h4>${p.Nombre}</h4>
                    <p class="price-tag">$${p.Precio}</p>
                    <p style="font-size:0.8rem; color:#888">Stock: ${p.Stock}</p>
                    <button class="btn btn-success" style="width:100%; margin-top:10px" onclick="addToCart(${p.ID})">Agregar 🛍️</button>
                </div>
            `).join('');
        }

       function renderClients(dataToRender = clients) {
    const tbody = document.querySelector('#clientsTable tbody');
    tbody.innerHTML = dataToRender.map(c => `
        <tr>
            <td>${c.Nombre}</td>
            <td>${c.Telefono}</td>
            <td>${c.Direccion}</td>
            <td>
                <button class="btn-action btn-edit" onclick="editClient(${c.ID})"><i class="fas fa-edit"></i></button>
                <button class="btn-action btn-delete" onclick="deleteClient(${c.ID})"><i class="fas fa-trash"></i></button>
            </td>
        </tr>
    `).join('');
}

        function renderInventory() {
            const tbody = document.querySelector('#inventoryTable tbody');
            tbody.innerHTML = products.map(p => `
                <tr>
                    <td>${p.Nombre}</td>
                    <td>${p.Stock}</td>
                </tr>
            `).join('');
        }

        function populateClientSelect() {
            const sel = document.getElementById('selectClient');
            sel.innerHTML = clients.map(c => `<option value="${c.ID}">${c.Nombre} - ${c.Telefono}</option>`).join('');
        }

        // --- CARRITO & PEDIDOS ---
        function addToCart(id) {
            const prod = products.find(p => p.ID == id);
            cart.push(prod);
            document.getElementById('cartFloat').style.display = 'block';
            document.getElementById('cartCount').innerText = cart.length;
        }

        function checkout() {
            if(cart.length === 0) return;
            const total = cart.reduce((sum, item) => sum + parseFloat(item.Precio), 0);
            document.getElementById('orderSummary').innerHTML = `
                <h4>Resumen:</h4>
                <ul>${cart.map(i => `<li>${i.Nombre} - $${i.Precio}</li>`).join('')}</ul>
                <h3>Total: $${total}</h3>
            `;
            document.getElementById('orderModal').style.display = 'flex';
        }

        function sendWhatsApp() {
            const clientId = document.getElementById('selectClient').value;
            const client = clients.find(c => c.ID == clientId);
            const anticipo = document.getElementById('inputAnticipo').value;
            const total = cart.reduce((sum, item) => sum + parseFloat(item.Precio), 0);
            
            let msg = `✨ *NUEVO PEDIDO INSPIRA* ✨\n\n`;
            msg += `*Cliente:* ${client.Nombre}\n`;
            msg += `*Tel:* ${client.Telefono}\n`;
            msg += `*Dir:* ${client.Direccion}\n\n`;
            msg += `*Productos:*\n`;
            cart.forEach(i => msg += `▪️ ${i.Nombre} - $${i.Precio}\n`);
            msg += `\n*Total:* $${total}\n`;
            msg += `*Anticipo:* $${anticipo}\n`;
            msg += `*Restante:* $${total - anticipo}\n`;

            const url = `https://wa.me/${client.Telefono}?text=${encodeURIComponent(msg)}`;
            window.open(url, '_blank');
        }

        async function saveOrder() {
            const clientId = document.getElementById('selectClient').value;
            const anticipo = document.getElementById('inputAnticipo').value;
            const total = cart.reduce((sum, item) => sum + parseFloat(item.Precio), 0);
            const detalle = cart.map(i => i.Nombre).join(', ');
            
            const data = [new Date().toLocaleDateString(), clientId, detalle, total, anticipo, 'Pendiente'];
            
            await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ tipo: 'Pedidos', accion: 'crear', datos: data })
            });
            
            alert('Pedido Guardado! 💜');
            cart = [];
            document.getElementById('cartFloat').style.display = 'none';
            closeModal('orderModal');
        }

        async function saveClient() {
            const name = document.getElementById('cName').value;
            const phone = document.getElementById('cPhone').value;
            const addr = document.getElementById('cAddr').value;
            
            const data = [Date.now(), name, phone, addr];
            await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ tipo: 'Clientes', accion: 'crear', datos: data })
            });
            alert('Cliente Agregado! ✨');
            closeModal('clientModal');
            loadData();
        }

        // --- UI HELPERS ---
        function showTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + tabName).style.display = 'block';
            event.target.classList.add('active');
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        // Función para buscar clientes
function filterClients() {
    const term = document.getElementById('searchClient').value.toLowerCase();
    const filtered = clients.filter(c => 
        c.Nombre.toLowerCase().includes(term) || 
        c.Telefono.toString().includes(term)
    );
    renderClients(filtered);
}

// Función para cargar datos en el modal y editar
function editClient(id) {
    const client = clients.find(c => c.ID == id);
    if (client) {
        document.getElementById('modalTitle').innerText = 'Editar Cliente ✏️';
        document.getElementById('cId').value = client.ID;
        document.getElementById('cName').value = client.Nombre;
        document.getElementById('cPhone').value = client.Telefono;
        document.getElementById('cAddr').value = client.Direccion;
        document.getElementById('clientModal').style.display = 'flex';
    }
}

// Función para eliminar cliente
async function deleteClient(id) {
    if(confirm('¿Seguro que deseas eliminar este cliente? Esta acción no se puede deshacer.')) {
        try {
            await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ tipo: 'Clientes', accion: 'eliminar', datos: id })
            });
            alert('Cliente eliminado 🗑️');
            loadData(); // Recargar la lista
        } catch (e) {
            alert('Error al eliminar');
        }
    }
}

// Modifica tu función saveClient existente por esta (ahora detecta si es editar o crear):
async function saveClient() {
    const id = document.getElementById('cId').value;
    const name = document.getElementById('cName').value;
    const phone = document.getElementById('cPhone').value;
    const addr = document.getElementById('cAddr').value;
    
    if(!name || !phone) { alert('Nombre y teléfono son obligatorios'); return; }

    let accion = 'crear';
    let datos = [Date.now(), name, phone, addr]; // ID nuevo si es crear
    
    if (id) {
        accion = 'actualizar';
        datos = [parseInt(id), name, phone, addr]; // Mantener ID original al editar
    }

    try {
        await fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify({ tipo: 'Clientes', accion: accion, datos: datos })
        });
        
        alert(id ? 'Cliente Actualizado! ✨' : 'Cliente Agregado! ✨');
        closeModal('clientModal');
        
        // Limpiar formulario
        document.getElementById('cId').value = '';
        document.getElementById('cName').value = '';
        document.getElementById('cPhone').value = '';
        document.getElementById('cAddr').value = '';
        document.getElementById('modalTitle').innerText = 'Nuevo Cliente ✨';
        
        loadData(); // Recargar lista
    } catch (e) {
        alert('Error al guardar');
    }
}

// Modifica la función openModal para limpiar el formulario si es para crear nuevo:
function openModal(id) { 
    if(id === 'clientModal') {
        document.getElementById('cId').value = ''; 
        document.getElementById('cName').value = '';
        document.getElementById('cPhone').value = '';
        document.getElementById('cAddr').value = '';
        document.getElementById('modalTitle').innerText = 'Nuevo Cliente ✨';
    }
    document.getElementById(id).style.display = 'flex'; 
}

        
    </script>
</body>
</html>
